services:
  postgres:
    # Built here: the stock image has neither pgvector nor pg_textsearch.
    build: ./docker/postgres
    image: hm-archiv-postgres:17
    ports:
      # 5434, so it cannot collide with a Postgres of another project.
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hm_archiv_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The S3-compatible store of production, here only for `src/server/storage.test.ts`.
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    ports:
      # 9100, so it cannot collide with a MinIO of another project.
      - '9100:9000'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-only
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
